bunching:
  gap_ratio_threshold: 1.5
  headway_ratio_threshold: 0.5
  min_scheduled_headway_minutes: 3
# This is the complete, generated-data taxonomy for the delay_severity target.
# "Major" is deliberately not a label: delays of 20 minutes or more are Severe.
# Keep this contract in sync with the bands below before retraining any delay model.
delay_severity_contract:
  version: v1
  labels: [On Time, Minor, Moderate, Severe]
  model_training_cutpoints_minutes: [5, 10, 20]
  excluded_label: Major
  rationale: "The generated source data has four delay classes; it does not generate a Major class."
delay_severity:
- below_minutes: 5
  name: On Time
- below_minutes: 10
  name: Minor
- below_minutes: 20
  name: Moderate
- below_minutes: null
  name: Severe
occupancy_categories:
- max_ratio: 0.4
  name: Low
- max_ratio: 0.7
  name: Moderate
- max_ratio: 0.9
  name: High
- max_ratio: 1.1
  name: Overcrowded
- max_ratio: null
  name: Critical
peak_detection:
  default_peak_hours:
    evening:
    - '16:30'
    - '18:30'
    morning:
    - 07:00
    - 09:00
  min_share_of_daily_ridership: 0.08
  window_minutes: 60
  zscore_threshold: 1.5
recommendations:
  priority_rules:
    anomaly_min_count: 80
    capacity_min_denied_boardings: 35
    critical_bottleneck_delay_pct: 0.25
    critical_delay_trip_pct: 0.60
    critical_occupancy_threshold: 0.95
    high_demand_supply_gap: 0.25
    high_occupancy_threshold: 0.85
    high_reliability_threshold: 0.6
    low_schedule_deviation_min: 5
    # Phase 9 actionability gates. Each recommendation is supported by a
    # route/stop identifier, counts, and the 30-day evaluation window.
    frequency_medium_overload_days_pct: 0.85
    frequency_critical_overload_days_pct: 0.95
    capacity_min_p90_load: 90
    schedule_critical_late_share: 0.60
    schedule_low_late_share: 0.45
    schedule_low_early_share: 0.45
    medium_headway_irregularity: 0.25
    medium_low_occupancy_threshold: 0.01
    medium_low_occupancy_trip_pct: 0.6
status: initial, to be tuned
