# Phase 5 analytics parameters. Occupancy categories and bunching ratios come from
# config/thresholds.yaml; the on-time band comes from config/phase4.yaml (delay).
# Every value here is a documented analytical choice, not a measured number.

# Clock periods by scheduled-departure hour (inclusive). Peak *detection* uses the
# leak-free peak_hour_indicator_asof; these periods only label the day.
time_periods:
  - { name: early_morning, from_hour: 0,  to_hour: 6 }
  - { name: morning_peak,  from_hour: 7,  to_hour: 9 }
  - { name: midday,        from_hour: 10, to_hour: 15 }
  - { name: evening_peak,  from_hour: 16, to_hour: 18 }
  - { name: evening,       from_hour: 19, to_hour: 23 }

expansion:
  # A route x month x period cell needs this many card tickets on measured trips for its
  # own factor; otherwise route x month, then system x month is used.
  min_tickets_per_cell: 30

peak:
  asof_peak_rate: 0.5          # hour/period is "peak" if >= 50% of its trips are flagged by peak_hour_indicator_asof

overcrowding:
  overload_categories: [Overcrowded, Critical]
  underload_categories: [Low]
  min_days_observed: 4         # a route/direction/day-of-week/period cell needs 4 normal days to be judged
  persistent_min_days: 4       # overloaded on >= 4 days ...
  persistent_min_share: 0.5    # ... and on >= 50% of the observed days
  one_off_max_days: 2          # overloaded on 1-2 days only = one-off

underutilized:
  max_avg_occupancy: 0.25
  max_p90_occupancy: 0.50
  min_trips_per_hour: 2        # below this, cutting service harms coverage -> "low use, low frequency"
  min_measured_trips: 30

route_scoring:
  min_service_days: 28         # newer routes (launched mid-year) -> "Insufficient Data"
  min_demand_coverage: 0.5     # share of operated trips with passenger counts
  target_occupancy: 0.70       # occupancy score peaks here (neither empty nor crowded)
  # Class from the composite score first (percentile rank among eligible routes) ...
  high_performing_rank: 0.7    # composite rank >= 0.7 (top 30%)    -> High Performing
  low_performing_rank: 0.3     # composite rank <= 0.3 (bottom 30%) -> Low Performing
  # ... then the middle band is diagnosed from the component scores:
  high_percentile: 0.6         # "high" demand score / reliability rank
  low_percentile: 0.4          # "low"  demand score / reliability rank
  underload_share: 0.5         # median daily share of Low-occupancy trips that also means "underutilized"
  overcrowded_class_overload_share: 0.20   # median daily share of Overcrowded/Critical trips -> Overcrowded class
  # Overcrowded FLAG (separate from the class): >= 1 persistent overload cell (item 6).
  stop_hotspot_share: 0.6      # >= 60% of overloaded trips peak at one stop -> stop-specific overcrowding
  stop_hotspot_sensitivity_share: 0.4   # reported only (sensitivity check), never used to classify
  # Overcrowding component (SRS Step 15), severity-weighted, 0-100 (100 = never overloaded):
  #   severity   = median over normal days of the day's mean trip weight
  #                (Overcrowded = 0.5, Critical = 1.0, any other measured trip = 0)
  #   persistence = persistent overload cells / judged cells (item 6)
  #   penalty    = 0.5 * severity + 0.5 * persistence
  #   score      = 100 * max(0, 1 - penalty / full_penalty_at)
  overload_severity_weights: { Overcrowded: 0.5, Critical: 1.0 }
  overcrowding_penalty_weights: { severity: 0.5, persistence: 0.5 }
  overcrowding_full_penalty_at: 0.5       # a penalty of 0.5 or more scores 0
  # Composite = weighted mean of the nine SRS Step 15 inputs, divided by the sum of the weights
  # (1.10). The six performance weights and load keep their earlier values; underutilization and
  # overcrowding replace the old combined utilisation weight (0.10) with 0.10 each.
  weights: { demand: 0.20, occupancy: 0.10, punctuality: 0.15, delay_frequency: 0.15,
             travel_time: 0.10, reliability: 0.10, load: 0.10, underutilization: 0.10,
             overcrowding: 0.10 }

delay:
  congestion_extra_min: 1.0    # peak-period mean arrival delay this much above midday = congestion pattern
  consistent_share_of_days: 0.75
  min_days: 20
  min_vehicle_trips: 100
  bottleneck_top_share: 0.05   # top 5% of stops by delay-record rate ...
  bottleneck_min_records: 50   # ... with at least 50 delay records
  distance_bands_km: [5, 10, 15, 20]

frequency:
  too_little_avg_occupancy: 0.85
  too_little_overload_share: 0.20
  too_much_avg_occupancy: 0.30
  too_much_p90_occupancy: 0.50
  min_trips_per_hour: 2

supply:
  target_load: 0.85            # design load for recommended capacity
  excess_demand_utilization: 0.90
  excess_supply_utilization: 0.30
  excess_demand_denied_per_trip: 1.0

events:
  baseline_days: 56            # same weekday over the previous 8 weeks (current week excluded)
  min_baseline_days: 4
  spike_ratio: 1.5
  drop_ratio: 0.5
  city_event_min_routes: 3

anomalies:
  abnormal_delay_min: 60
  travel_time_low_ratio: 0.5
  travel_time_high_ratio: 2.0
  stop_spike_ratio: 3.0
  stop_drop_ratio: 0.2
  stop_min_baseline: 20
  duplicate_tap_seconds: 120

segmentation:
  commuter_min_days_per_week: 3
  commuter_min_weekday_share: 0.8
  weekend_min_share: 0.5
  long_distance_percentile: 0.8   # avg journey km at or above the 80th percentile of passengers
  peak_min_share: 0.7

output_partitions: 1
large_output_partitions: 4
